; Copy to config.ini and fill it in. The [telegram] section is only needed for downloading via the bot.

[telegram]
; get them at https://my.telegram.org -> API development tools
api_id = 0
api_hash = PASTE_API_HASH

[bot]
username = Spotify_downloaderrr_bot

[run]
; CSV from exportify.net (or a .txt file with track links, one per line) — in the data/ folder
tracks_file = liked_songs.csv
; where to save music (relative to the project folder)
out_dir = music
; YouTube cookies in Netscape format, in the data/ folder — without them you get "Sign in to confirm you're not a bot"
cookies = cookies.txt
; minimum seconds between bot downloads (the free bot has a ~90 s cooldown)
cooldown = 95
; how long to wait for a file from the bot, seconds (uncached tracks are slow)
timeout = 600
