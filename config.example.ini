; Скопируй в config.ini и заполни. Секция [telegram] нужна только для скачивания через бота.

[telegram]
; получить на https://my.telegram.org -> API development tools
api_id = 0
api_hash = PASTE_API_HASH

[bot]
username = Spotify_downloaderrr_bot

[run]
; CSV из exportify.net (или .txt со ссылками на треки, по одной на строку) — лежит в папке data/
tracks_file = liked_songs.csv
; куда складывать музыку (относительно папки проекта)
out_dir = music
; куки YouTube в формате Netscape, в папке data/ — без них "Sign in to confirm you're not a bot"
cookies = cookies.txt
; минимум секунд между запусками скачивания (у бесплатного бота кулдаун ~90)
cooldown = 95
; сколько ждать файл от бота, сек (незакэшированные треки бот качает медленно)
timeout = 600
